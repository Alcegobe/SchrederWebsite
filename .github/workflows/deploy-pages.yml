name: Deploy wireframe to GitHub Pages

# Publie la maquette (wireframe) sur GitHub Pages.
# Le dossier docs/ (analyse marketing interne) est volontairement EXCLU du site en ligne.

on:
  # Déploiement automatique à chaque push sur la branche de travail
  # (permet aussi que l'ajout du logo via l'UI GitHub parte en ligne tout seul).
  push:
    branches:
      - claude/happy-shannon-k0xiud
  # Déclenchement manuel possible également.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site (wireframe only)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp faithful.html _site/
          cp -r css _site/
          cp -r js _site/
          if [ -d assets ]; then cp -r assets _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
